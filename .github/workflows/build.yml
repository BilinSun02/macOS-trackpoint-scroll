name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CORE_REPO_TOKEN }}
      - name: Build
        run: make
      - name: CLI smoke test
        run: ./build/macOS-trackpoint-scroll --help
