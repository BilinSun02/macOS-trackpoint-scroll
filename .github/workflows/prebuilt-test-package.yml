name: Build prebuilt test package

on:
  push:
    branches:
      - edge-pressure-latch-hardening

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make dist
          (
            cd dist
            shasum -a 256 -c "macOS-trackpoint-scroll-$(cat ../VERSION).tar.gz.sha256"
          )

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: edge-pressure-latch-hardening-prebuilt
          path: |
            dist/macOS-trackpoint-scroll-*.tar.gz
            dist/macOS-trackpoint-scroll-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
